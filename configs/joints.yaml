# Learned joints and calibrated limits.
# Units: radians. Names: those of NAOqi (ALMotion).
# The legs are not listed here: they stay outside the learning scope
# and are never commanded by this software.
#
# IMPORTANT: the limits below are PLACEHOLDER VALUES for the
# simulation, cautiously derived from the nominal ranges published for NAO.
# The guardian's real limits come ONLY from a calibration measured
# on the robot (`nao-motion calibrate`, active file in configs/calibration/).
# Without an active calibration, execution on the real robot is refused.
schema_version: 1
calibration:
  version: placeholder-0      # name shown when no calibration is active

groups:
  left_arm:  [LShoulderPitch, LShoulderRoll, LElbowYaw, LElbowRoll, LWristYaw]
  right_arm: [RShoulderPitch, RShoulderRoll, RElbowYaw, RElbowRoll, RWristYaw]
  head:      [HeadYaw, HeadPitch]

# min / max in radians. A safety margin is also applied by the guardian.
limits:
  LShoulderPitch: [-1.80, 1.80]
  LShoulderRoll:  [-0.25, 1.20]
  LElbowYaw:      [-1.80, 1.80]
  LElbowRoll:     [-1.45, -0.05]
  LWristYaw:      [-1.50, 1.50]
  RShoulderPitch: [-1.80, 1.80]
  RShoulderRoll:  [-1.20, 0.25]
  RElbowYaw:      [-1.80, 1.80]
  RElbowRoll:     [0.05, 1.45]
  RWristYaw:      [-1.50, 1.50]
  HeadYaw:        [-1.60, 1.60]
  HeadPitch:      [-0.60, 0.45]

# Hands: finger opening. LHand / RHand are NOT angles: 0 = closed hand,
# 1 = open hand, any intermediate value is possible (NAO V4 factory range, read by
# ALMotion.getLimits). The hands cannot be guided by hand: they are driven from
# the interface (Mains tab, pass 3). They do not go through calibration: they
# stay bounded by this range, which the active calibration does not replace.
hands:
  joints: [LHand, RHand]
  limits:
    LHand: [0.0, 1.0]
    RHand: [0.0, 1.0]
