schema_version: 1
representation:
  n_control_points: 12      # cubic B-spline control points per joint (was 8: flattened beats, waves and quick
                            # peaks, see `nao-motion fidelity`). Each model stores its own value, so models
                            # trained with 8 keep working. Per training: Network tab or --control-points
  n_eval_samples: 100       # phase samples used for fitting and metrics
arm_model:
  hidden: [64, 64]
  dropout: 0.0
head_model:                 # independent of the arms: same inputs (emotion, intensity, event)
  hidden: [64, 64]
  dropout: 0.0
hands_model:                # hand opening, independent of the arms
  hidden: [64, 64]
  dropout: 0.0
  target: command           # command (target given by the operator) | measured (hand sensor)
combine:                    # arms + head + hands assembly at generation
  timing: hold              # hold: each group keeps its learned duration, shorter ones hold their final pose
                            # stretch: all groups stretched over the longest duration
sequence:                   # exported generator, generate(..., duration_s=D): learned gestures drawn and blended
                            # into one movement cut to D s (e.g. the speech). Within each draw the groups share
                            # the draw's duration
  duration_fit: intensity   # intensity: the tempo may change to fit D, the less the more intense (below);
                            # off: learned tempo, the cut alone fits D
  duration_margin_k: 1.0    # time factor allowed in [1 - k (1 - intensity), 1 + k (1 - intensity)]; faster only if
                            # the guardian accepts it. Intensity 1 = learned tempo
  scale_min: 0.7            # bounds of that factor, whatever the intensity
  scale_max: 3.0
training:
  epochs: 800
  lr: 0.01
  weight_decay: 0.0001
  val_fraction: 0.25        # used only when folds is 0 or 1 (single split, the former behaviour)
  folds: 5                  # cross-validation: takes dealt into 5 parts by group, 5 models trained, each validated
                            # on the part it never saw (every take validated once); the KEPT model is then
                            # trained on ALL the takes for the mean best epoch of the parts. 0 or 1 = single split
  seed: 0
  smoothness_weight: 0.0    # penalty on the curvature of the control points. It flattens quick gestures (with 8
                            # points, 0.01 kept ~20 % of a 2-beat gesture); the curve is already smooth by
                            # construction and the guardian checks speed/acceleration at playback
  motion_energy_weight: 0.1 # each joint must move as much as in its take (RMS speed), whatever the timing. Without
                            # it the model learns the MEAN of the takes: waves done at different moments cancel
                            # out and a wave becomes a still arm. 0 = former behaviour (pointwise error only)
  duration_weight: 0.05     # weight of the error on log(duration)
  mirror: true              # add left/right mirrors of the training takes WITHOUT an event (in memory only;
                            # validation stays on real takes; unfeasible mirrors are dropped, see data/mirror.py)
cvae:                       # CVAE mode: the MLP above becomes a DECODER that also receives a latent code z,
                            # and a small encoder reads each take to give its z. One prompt (emotion,
                            # intensity, event) can then give several whole gestures instead of their mean.
                            # Off = the plain MLP, unchanged. Per training: Network tab or --cvae
  enabled: false
  latent_dim: 4             # size of z: how many independent "ways of doing" the model can tell apart
  beta: 0.003               # weight of the KL term (pulls the z codes towards N(0, 1)); higher = smoother
                            # map but fewer z dimensions used, lower = sharper reconstruction
  kl_warmup: 200            # epochs over which beta grows from 0; the best epoch is looked for after them
  encoder_hidden: [64]      # hidden layers of the encoder (used for training and for the z map only)
  temperature: 1.0          # generation: z drawn from N(0, T²). 0 = central gesture (z = 0), 1 = as varied
                            # as the takes. Generation tab field; also the default of the exported generator
