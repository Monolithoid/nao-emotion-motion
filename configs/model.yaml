schema_version: 1
representation:
  n_control_points: 12      # cubic B-spline control points per joint (was 8: flattened beats, waves and quick
                            # peaks, see `nao-motion fidelity`). Each model stores its own value, so models
                            # trained with 8 keep working. Per training: Network tab or --control-points
  n_eval_samples: 100       # échantillons de phase utilisés pour l'ajustement et les métriques
arm_model:
  hidden: [64, 64]
  dropout: 0.0
head_model:                 # indépendant des bras : mêmes entrées (émotion, intensité, événement)
  hidden: [64, 64]
  dropout: 0.0
hands_model:                # ouverture des mains, indépendante des bras
  hidden: [64, 64]
  dropout: 0.0
  target: command           # command (consigne donnée par l'opérateur) | measured (capteur de la main)
combine:                    # assemblage bras + tête + mains à la génération
  timing: hold              # hold : chaque groupe garde sa durée apprise, les plus courts tiennent leur pose finale
                            # stretch : tous les groupes étirés sur la durée la plus longue
training:
  epochs: 800
  lr: 0.01
  weight_decay: 0.0001
  val_fraction: 0.25        # used only when folds is 0 or 1 (single split, the former behaviour)
  folds: 5                  # cross-validation: takes dealt into 5 parts by group, 5 models trained, each validated
                            # on the part it never saw (every take validated once); the KEPT model is then
                            # trained on ALL the takes for the mean best epoch of the parts. 0 or 1 = single split
  seed: 0
  smoothness_weight: 0.0    # penalty on the curvature of the control points. It flattens quick gestures (with 8
                            # points, 0.01 kept ~20 % of a 2-beat gesture); the curve is already smooth by
                            # construction and the guardian checks speed/acceleration at playback
  duration_weight: 0.05     # poids de l erreur sur log(durée)
  mirror: true              # add left/right mirrors of the training takes WITHOUT an event (in memory only;
                            # validation stays on real takes ; unfeasible mirrors are dropped, see data/mirror.py)
