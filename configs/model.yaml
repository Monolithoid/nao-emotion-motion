schema_version: 1
representation:
  n_control_points: 8       # points de contrôle B-spline cubique par articulation
  n_eval_samples: 100       # échantillons de phase utilisés pour l'ajustement et les métriques
arm_model:
  hidden: [64, 64]
  dropout: 0.0
head_model:                 # indépendant des bras : mêmes entrées (émotion, intensité, événement)
  hidden: [64, 64]
  dropout: 0.0
hands_model:                # ouverture des mains, indépendante des bras
  hidden: [64, 64]
  dropout: 0.0
  target: command           # command (consigne donnée par l'opérateur) | measured (capteur de la main)
combine:                    # assemblage bras + tête + mains à la génération
  timing: hold              # hold : chaque groupe garde sa durée apprise, les plus courts tiennent leur pose finale
                            # stretch : tous les groupes étirés sur la durée la plus longue
training:
  epochs: 800
  lr: 0.01
  weight_decay: 0.0001
  val_fraction: 0.25
  seed: 0
  smoothness_weight: 0.01
  duration_weight: 0.05     # poids de l erreur sur log(durée)
