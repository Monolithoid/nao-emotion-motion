# Initial list, short and EDITABLE. It is not a scientific taxonomy:
# these are working labels to organise the demonstrations.
# Adding/removing an emotion changes the models' input dimension:
# checkpoints store the list used and refuse a different list.
schema_version: 1
emotions:
  - {id: joie,      label: "joie"}
  - {id: tristesse, label: "tristesse"}
  - {id: colere,    label: "colère"}
  - {id: peur,      label: "peur"}
  - {id: surprise,  label: "surprise"}
  - {id: calme,     label: "calme"}

# Expressive intentions: distinct from emotions (one can welcome with joy
# or calmly). They are recorded as an optional annotation of the takes
# but do not condition the models yet.
intentions:
  - {id: accueillir, label: "accueillir"}
  - {id: refuser,    label: "refuser"}
  - {id: saluer,     label: "saluer"}
  - {id: montrer,    label: "montrer / désigner"}
