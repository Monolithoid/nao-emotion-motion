# Connection and execution. Nothing is assumed about your robot: fields
# marked null must be filled in before any real connection.
# Variables from the .env file (see .env.example) and from the environment
# REPLACE the values in this file (NAO_IP, NAOQI_VERSION, ...).
schema_version: 1
adapter: sim                # sim | bridge  (bridge = NAOqi bridge, see bridge/)
robot:
  name: null                # ALSystem.robotName; checked when arming if set
  model: null               # e.g. "NAO V5" / "NAO V6" (to fill in)
  naoqi_version: null       # e.g. "2.1.4" / "2.8.x" (to fill in)
  ip: null
  port: 9559
bridge:
  location: robot           # robot (recommended: nothing to install, naoqi is already on the NAO) | pc (pynaoqi SDK required)
  host: 127.0.0.1           # machine running bridge/naoqi_bridge.py when location = pc
  port: 9600
  heartbeat_s: 0.2          # the bridge stops the movement if it no longer receives a heartbeat
  watchdog_s: 0.6
  timeout_s: 3.0            # bridge response timeout (NAO Wi-Fi latency); beyond it, the connection is closed
execution:
  # The controller sends setAngles targets at a fixed rate (streaming),
  # which makes it possible to check stop/connection at each step. The bridge also exposes
  # angleInterpolation, not used by the controller in this first version.
  stream_rate_hz: 25
  # Tracking (measured vs command). NAO tracking is noisy: above tracking_error_rad the play
  # only WARNS; it stops (and holds) when the gap stays above it for tracking_persist_s, or goes
  # above tracking_stop_rad at any moment.
  tracking_error_rad: 0.35
  tracking_persist_s: 0.5
  tracking_stop_rad: 0.8
  # On such a stop: relax = cut the motors of the played joints (arms may drop), hold = keep
  # the measured posture stiff.
  tracking_stop_action: relax
  # setAngles (streaming): max velocity left to the motor, as a fraction of its factory velocity.
  # It must be at least equal to the guardian limit (guardian.yaml
  # velocity_fraction_of_factory), otherwise the robot does not follow the validated gesture and falls
  # behind (tracking stop). It also caps the guardian limits (see guardian.yaml).
  max_fraction_speed: 1.0
  hand_tracking_error: 0.5  # hands (opening fraction): the hand motor follows more slowly
  # The measured angle is compared with the command over the last tracking_lag_s (latency of
  # the bridge and of setAngles), so a joint that is only late does not stop the play.
  tracking_lag_s: 0.3
  # Per-joint thresholds (rad), override tracking_error_rad. Wrists are light and fast.
  tracking_error_per_joint: {LWristYaw: 0.5, RWristYaw: 0.5}
  # Guardian off (Generation tab test): thresholds multiplied by this factor (raw, faster gestures).
  tracking_error_factor_guardian_off: 1.5
  # Control points of a generated gesture that fall outside the guardian zone (calibrated
  # limits minus margin, coupled constraints within one group) are moved to the nearest point
  # inside before decoding (nao_motion/guardian/project.py). A B-spline stays in the convex hull
  # of its control points, so the curve stays in the zone; speed is still handled below.
  # Also applied with the guardian off. Checkbox in the Generation tab.
  project_control_points: true
  # Generated gestures are made playable before the guardian checks them: slowed down just
  # enough for the velocity/acceleration limits and brought back inside the limits
  # (nao_motion/guardian/playable.py). The guardian still validates the result and refuses
  # what fails. false = the raw generated gesture is checked as is.
  adapt_generated: true
  # How the gesture is slowed down: local = only the moments above a limit (smooth time warp,
  # the rest keeps the model's tempo); uniform = the whole gesture by one factor.
  slow_down: local
recording:
  rate_hz: 50
  countdown_s: 3
# Stiffness per role. A guided (relaxed) joint is NEVER commanded
# at the same time; a driven joint is never relaxed during a take.
stiffness:
  driven: 0.8
  guided: 0.0
  hold: 0.6
inference:
  location: local           # local | remote
  backend: torch            # torch | numpy (lightweight export)
  remote_url: null          # e.g. http://192.168.1.20:8765 if location = remote
# External event: ranges for the random draw and for the interface's field
# of view (collection and generation). The model receives the proximity 1/(1+d),
# independent of these ranges.
events:
  distance_m: [0.3, 3.0]      # minimum / maximum distance (m)
  azimuth_deg: [-90, 90]      # azimuth, positive to the robot's left
  elevation_deg: [-30, 45]    # elevation, positive up
  # BALANCED random draw (see nao_motion/data/balance.py): the space is
  # split into cells emotion × intensity band × zone (azimuth × elevation ×
  # distance, + "no event"); the least filled cells of the current pass
  # (non-rejected takes) are favoured.
  balance:
    intensity: [0.1, 1.0]     # intensity range drawn
    intensity_bins: 3         # low / medium / high
    azimuth_bins: 3           # right / front / left
    elevation_bins: 2         # low / high
    distance_bins: 2          # near / far (cut at the geometric mean)
    none_share: 0.2           # target share of takes without an event (if the box is checked)
    cell_weight: 4.0          # weight of the cell's deficit versus the deficits per emotion / intensity / zone
    strength: 2.0             # 0 = uniform; 2 = an emotion one take behind is e²≈7× more likely
# Collection progress (Prises tab, see nao_motion/data/progress.py):
# milestones of ACCEPTED takes per group (arms, head and hands are trained
# independently). Each milestone: a number or {takes: N, label: "..."};
# the last milestone is the group's goal. Simulated takes do not count.
progress:
  arms:
    - {takes: 60, label: "1er entraînement : tester la chaîne"}
    - {takes: 150, label: "modèle utilisable"}
    - {takes: 200, label: "objectif"}
  head:
    - {takes: 60, label: "1er entraînement : tester la chaîne"}
    - {takes: 150, label: "modèle utilisable"}
    - {takes: 200, label: "objectif"}
  hands:
    - {takes: 60, label: "1er entraînement : tester la chaîne"}
    - {takes: 100, label: "objectif"}
