# Connexion et exécution. Rien n'est supposé sur votre robot : les champs
# marqués null doivent être renseignés avant toute connexion réelle.
# Les variables du fichier .env (voir .env.example) et de l'environnement
# REMPLACENT les valeurs de ce fichier (NAO_IP, NAOQI_VERSION, ...).
schema_version: 1
adapter: sim                # sim | bridge  (bridge = pont NAOqi, voir bridge/)
robot:
  name: null                # ALSystem.robotName ; vérifié à l'armement s'il est renseigné
  model: null               # ex. "NAO V5" / "NAO V6" (à renseigner)
  naoqi_version: null       # ex. "2.1.4" / "2.8.x" (à renseigner)
  ip: null
  port: 9559
bridge:
  location: robot           # robot (recommandé : rien à installer, naoqi est déjà sur le NAO) | pc (SDK pynaoqi requis)
  host: 127.0.0.1           # machine où tourne bridge/naoqi_bridge.py quand location = pc
  port: 9600
  heartbeat_s: 0.2          # le pont arrête le mouvement s'il ne reçoit plus de battement
  watchdog_s: 0.6
execution:
  # Le contrôleur envoie des consignes setAngles à cadence fixe (streaming),
  # ce qui permet de vérifier arrêt/connexion à chaque pas. Le pont expose aussi
  # angleInterpolation, non utilisé par le contrôleur dans ce premier socle.
  stream_rate_hz: 25
  tracking_error_rad: 0.35  # écart consigne/mesure au-delà duquel on arrête et maintient
  max_fraction_speed: 0.3   # utilisé par setAngles
recording:
  rate_hz: 50
  countdown_s: 3
# Raideur par rôle. Une articulation guidée (relâchée) n'est JAMAIS commandée
# en même temps ; une articulation pilotée n'est jamais relâchée pendant une prise.
stiffness:
  driven: 0.8
  guided: 0.0
  hold: 0.6
inference:
  location: local           # local | remote
  backend: torch            # torch | numpy (export léger)
  remote_url: null          # ex. http://192.168.1.20:8765 si location = remote
# Événement extérieur : plages du tirage aléatoire et du champ de vision de
# l'interface (collecte et génération). Le modèle reçoit la proximité 1/(1+d),
# indépendante de ces plages.
events:
  distance_m: [0.3, 3.0]      # distance minimale / maximale (m)
  azimuth_deg: [-90, 90]      # azimut, positif vers la gauche du robot
  elevation_deg: [-30, 45]    # élévation, positive vers le haut
