# Connexion et exécution. Rien n'est supposé sur votre robot : les champs
# marqués null doivent être renseignés avant toute connexion réelle.
# Les variables du fichier .env (voir .env.example) et de l'environnement
# REMPLACENT les valeurs de ce fichier (NAO_IP, NAOQI_VERSION, ...).
schema_version: 1
adapter: sim                # sim | bridge  (bridge = pont NAOqi, voir bridge/)
robot:
  name: null                # ALSystem.robotName ; vérifié à l'armement s'il est renseigné
  model: null               # ex. "NAO V5" / "NAO V6" (à renseigner)
  naoqi_version: null       # ex. "2.1.4" / "2.8.x" (à renseigner)
  ip: null
  port: 9559
bridge:
  location: robot           # robot (recommandé : rien à installer, naoqi est déjà sur le NAO) | pc (SDK pynaoqi requis)
  host: 127.0.0.1           # machine où tourne bridge/naoqi_bridge.py quand location = pc
  port: 9600
  heartbeat_s: 0.2          # le pont arrête le mouvement s'il ne reçoit plus de battement
  watchdog_s: 0.6
  timeout_s: 3.0            # délai de réponse du pont (latence Wi-Fi du NAO) ; au-delà, connexion fermée
execution:
  # Le contrôleur envoie des consignes setAngles à cadence fixe (streaming),
  # ce qui permet de vérifier arrêt/connexion à chaque pas. Le pont expose aussi
  # angleInterpolation, non utilisé par le contrôleur dans ce premier socle.
  stream_rate_hz: 25
  # Tracking (measured vs command). NAO tracking is noisy: above tracking_error_rad the play
  # only WARNS; it stops (and holds) when the gap stays above it for tracking_persist_s, or goes
  # above tracking_stop_rad at any moment.
  tracking_error_rad: 0.35
  tracking_persist_s: 0.5
  tracking_stop_rad: 0.8
  # On such a stop: relax = cut the motors of the played joints (arms may drop), hold = keep
  # the measured posture stiff.
  tracking_stop_action: relax
  # setAngles (streaming) : vitesse max laissée au moteur, en fraction de sa vitesse d'usine.
  # Elle doit dépasser la limite du guardian (guardian.yaml velocity_fraction_of_factory,
  # 0.5), sinon le robot ne suit pas le geste validé et prend du retard (arrêt de suivi).
  # Elle plafonne aussi les limites du guardian (voir guardian.yaml).
  max_fraction_speed: 0.6
  hand_tracking_error: 0.5  # mains (fraction d'ouverture) : le moteur de la main suit plus lentement
  # The measured angle is compared with the command over the last tracking_lag_s (latency of
  # the bridge and of setAngles), so a joint that is only late does not stop the play.
  tracking_lag_s: 0.3
  # Per-joint thresholds (rad), override tracking_error_rad. Wrists are light and fast.
  tracking_error_per_joint: {LWristYaw: 0.5, RWristYaw: 0.5}
  # Guardian off (Generation tab test): thresholds multiplied by this factor (raw, faster gestures).
  tracking_error_factor_guardian_off: 1.5
  # Control points of a generated gesture that fall outside the guardian zone (calibrated
  # limits minus margin, coupled constraints within one group) are moved to the nearest point
  # inside before decoding (nao_motion/guardian/project.py). A B-spline stays in the convex hull
  # of its control points, so the curve stays in the zone; speed is still handled below.
  # Also applied with the guardian off. Checkbox in the Generation tab.
  project_control_points: true
  # Generated gestures are made playable before the guardian checks them: slowed down just
  # enough for the velocity/acceleration limits and brought back inside the limits
  # (nao_motion/guardian/playable.py). The guardian still validates the result and refuses
  # what fails. false = the raw generated gesture is checked as is.
  adapt_generated: true
  # How the gesture is slowed down: local = only the moments above a limit (smooth time warp,
  # the rest keeps the model's tempo); uniform = the whole gesture by one factor.
  slow_down: local
recording:
  rate_hz: 50
  countdown_s: 3
# Raideur par rôle. Une articulation guidée (relâchée) n'est JAMAIS commandée
# en même temps ; une articulation pilotée n'est jamais relâchée pendant une prise.
stiffness:
  driven: 0.8
  guided: 0.0
  hold: 0.6
inference:
  location: local           # local | remote
  backend: torch            # torch | numpy (export léger)
  remote_url: null          # ex. http://192.168.1.20:8765 si location = remote
# Événement extérieur : plages du tirage aléatoire et du champ de vision de
# l'interface (collecte et génération). Le modèle reçoit la proximité 1/(1+d),
# indépendante de ces plages.
events:
  distance_m: [0.3, 3.0]      # distance minimale / maximale (m)
  azimuth_deg: [-90, 90]      # azimut, positif vers la gauche du robot
  elevation_deg: [-30, 45]    # élévation, positive vers le haut
  # Tirage aléatoire ÉQUILIBRÉ (voir nao_motion/data/balance.py) : l'espace est
  # découpé en cases émotion × tranche d'intensité × zone (azimut × élévation ×
  # distance, + « sans événement ») ; les cases les moins remplies du passage en
  # cours (prises non rejetées) sont favorisées.
  balance:
    intensity: [0.1, 1.0]     # plage d'intensité tirée
    intensity_bins: 3         # faible / moyenne / forte
    azimuth_bins: 3           # droite / devant / gauche
    elevation_bins: 2         # bas / haut
    distance_bins: 2          # proche / loin (coupure à la moyenne géométrique)
    none_share: 0.2           # part visée des prises sans événement (si la case est cochée)
    cell_weight: 4.0          # poids du retard de la case face aux retards par émotion / intensité / zone
    strength: 2.0             # 0 = uniforme ; 2 = une émotion en retard d'une prise est e²≈7× plus probable
# Avancement de la collecte (onglet Prises, voir nao_motion/data/progress.py) :
# paliers de prises ACCEPTÉES par groupe (bras, tête et mains s'entraînent
# indépendamment). Chaque palier : un nombre ou {takes: N, label: "..."} ;
# le dernier palier est l'objectif du groupe. Les prises simulées ne comptent pas.
progress:
  arms:
    - {takes: 60, label: "1er entraînement : tester la chaîne"}
    - {takes: 150, label: "modèle utilisable"}
    - {takes: 200, label: "objectif"}
  head:
    - {takes: 60, label: "1er entraînement : tester la chaîne"}
    - {takes: 150, label: "modèle utilisable"}
    - {takes: 200, label: "objectif"}
  hands:
    - {takes: 60, label: "1er entraînement : tester la chaîne"}
    - {takes: 100, label: "objectif"}
