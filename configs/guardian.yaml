# Contrôleur de sécurité indépendant des modèles.
# Toutes les valeurs sont à ajuster sur le robot réel ; elles sont prudentes par défaut.
schema_version: 1
limit_margin_rad: 0.03          # marge intérieure appliquée aux limites min/max
# Vitesse par articulation. Ordre de priorité :
#   1. per_joint_velocity_rad_s ci-dessous (choix explicite) ;
#   2. sinon velocity_fraction_of_factory x vitesse d'usine (factory_velocity_rad_s) ;
#   3. sinon max_velocity_rad_s.
# Les vitesses mesurées sur les prises (section kinematics d'une calibration étendue avec
# les prises, si elle est active) remplacent ensuite ces valeurs. Plafond dans tous les cas :
# robot.yaml max_fraction_speed x vitesse d'usine, la vitesse que setAngles laisse au moteur.
max_velocity_rad_s: 1.5         # articulations sans vitesse d'usine connue
# Vitesses à vide en sortie de réducteur (rad/s), calculées depuis la documentation
# Aldebaran « NAO - Motors » (V3.3, identique V4 à V6) : moteur type 1 (RE-Max 17,
# 11 900 tr/min) divisé par le rapport de réduction de l'articulation. Ce sont aussi les
# valeurs que renvoie ALMotion.getLimits. Clés sans le préfixe L/R.
factory_velocity_rad_s:
  HeadYaw: 8.29                 # réduction 150.27
  HeadPitch: 7.19               # 173.22
  ShoulderPitch: 8.29           # 150.27
  ShoulderRoll: 7.19            # 173.22
  ElbowYaw: 8.29                # 150.27
  ElbowRoll: 7.19               # 173.22
  WristYaw: 24.62               # 50.61
# Fraction de la vitesse d'usine prise comme limite (1 = limites d'usine, choix de
# l'opérateur 2026-11-18). Ce sont des vitesses À VIDE : en charge, le moteur va un peu
# moins vite, le suivi (robot.yaml, tracking_*) arrête le geste si le robot décroche.
velocity_fraction_of_factory: 1.0
# Accélération : pas de valeur d'usine. 30 rad/s² permet d'atteindre 4 rad/s en ~0,13 s
# (pic d'un geste humain de 1 rad en 0,4 s : ~36 rad/s² ; l'ancienne valeur, 8, ralentissait
# un tel geste x2 à elle seule). Tête : plus prudent, voir per_joint_acceleration.
max_acceleration_rad_s2: 30.0
per_joint_velocity_rad_s:       # surcharges explicites (prioritaires)
  HeadPitch: 1.0                # butée et câbles de la nuque
  LHand: 2.0                    # mains : fraction d'ouverture par seconde (0 = fermée, 1 = ouverte)
  RHand: 2.0
# Surcharges par articulation de la marge et de l'accélération. Mains : plage d'usine
# entière (0 à 1, butées gérées par le moteur de la main) et mouvement plus vif qu'un bras.
per_joint_margin:
  LHand: 0.0
  RHand: 0.0
per_joint_acceleration:
  HeadYaw: 8.0
  HeadPitch: 8.0
  LHand: 20.0
  RHand: 20.0
check_rate_hz: 100              # le trajet complet est vérifié à cette fréquence
min_duration_s: 0.3
max_duration_s: 15.0
start_tolerance_rad: 0.05       # écart toléré entre l'état mesuré et le début d'un segment
transition_velocity_rad_s: 0.5  # vitesse max des transitions repos <-> départ <-> geste
# Le repos peut être hors de la zone de mouvement calibrée (bras posés sur les genoux :
# contact). Les segments repos <-> départ sont donc vérifiés sur les limites d'usine,
# la vitesse ci-dessous et l'accélération, sans marge ni contraintes couplées. Que le
# départ soit accessible sans heurt depuis le repos reste à la charge de qui calibre.
rest_velocity_rad_s: 0.3

# Contraintes couplées linéaires : sum(coef_i * q_i) <= bound (radians).
# Elles complètent les min/max indépendants, qui ne garantissent PAS l'absence
# de collision. Exemples ci-dessous, à remplacer par des zones mesurées.
coupled_constraints:
  - name: tete_baissee_tournee
    description: "Limiter la flexion de la tête quand elle est très tournée (butée et câbles)."
    terms: {HeadPitch: 1.0, HeadYaw: 0.25}
    bound: 0.50
  - name: tete_baissee_tournee_neg
    terms: {HeadPitch: 1.0, HeadYaw: -0.25}
    bound: 0.50
  - name: bras_gauche_vers_tete
    description: "Exemple : bras gauche levé et rentré vers l'axe pendant que la tête tourne à gauche."
    terms: {LShoulderPitch: -1.0, LShoulderRoll: -1.0, HeadYaw: 0.5}
    bound: 1.40
  - name: bras_droit_vers_tete
    terms: {RShoulderPitch: -1.0, RShoulderRoll: 1.0, HeadYaw: -0.5}
    bound: 1.40
  - name: avant_bras_croises
    description: "Exemple : éviter que les deux bras se croisent devant le torse."
    terms: {LShoulderRoll: -1.0, RShoulderRoll: 1.0}
    bound: 0.35
