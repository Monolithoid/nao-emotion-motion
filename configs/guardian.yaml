# Safety checker independent of the models.
# All values are to be tuned on the real robot; they are cautious by default.
schema_version: 1
# Movement zone = what the calibration explored (arms guided by hand), minus
# zone_margin_rad. This margin REPLACES the calibration's (0.05) for the guardian:
# previously 0.05 + 0.03 = 0.08 rad were removed on each side of what the robot
# actually reached, while the start pose is often 0.1 rad from an edge.
# Remove the line to go back to the old rule.
zone_margin_rad: 0.02
limit_margin_rad: 0.03          # margin before the FACTORY STOPS (not before the calibrated zone)
# Velocity per joint. Priority order:
#   1. per_joint_velocity_rad_s below (explicit choice);
#   2. otherwise velocity_fraction_of_factory x factory velocity (factory_velocity_rad_s);
#   3. otherwise max_velocity_rad_s.
# Velocities measured on the takes (kinematics section of a calibration extended with
# the takes, if it is active) then replace these values. Cap in every case:
# robot.yaml max_fraction_speed x factory velocity, the velocity setAngles leaves to the motor.
max_velocity_rad_s: 1.5         # joints without a known factory velocity
# No-load velocities at the gearbox output (rad/s), computed from the Aldebaran
# "NAO - Motors" documentation (V3.3, identical for V4 to V6): motor type 1 (RE-Max 17,
# 11,900 rpm) divided by the joint's reduction ratio. These are also the
# values returned by ALMotion.getLimits. Keys without the L/R prefix.
factory_velocity_rad_s:
  HeadYaw: 8.29                 # reduction 150.27
  HeadPitch: 7.19               # 173.22
  ShoulderPitch: 8.29           # 150.27
  ShoulderRoll: 7.19            # 173.22
  ElbowYaw: 8.29                # 150.27
  ElbowRoll: 7.19               # 173.22
  WristYaw: 24.62               # 50.61
# Fraction of the factory velocity used as the limit (1 = factory limits, operator's
# choice 2026-11-18). These are NO-LOAD velocities: under load, the motor is a little
# slower; tracking (robot.yaml, tracking_*) stops the gesture if the robot falls behind.
velocity_fraction_of_factory: 1.0
# Acceleration: no factory value. 30 rad/s² reaches 4 rad/s in ~0.13 s
# (peak of a human gesture of 1 rad in 0.4 s: ~36 rad/s²; the old value, 8, slowed
# such a gesture down x2 on its own). Head: more cautious, see per_joint_acceleration.
max_acceleration_rad_s2: 30.0
per_joint_velocity_rad_s:       # explicit overrides (take priority)
  HeadPitch: 1.0                # neck end stop and cables
  LHand: 2.0                    # hands: opening fraction per second (0 = closed, 1 = open)
  RHand: 2.0
# Per-joint overrides of the margin and the acceleration. Hands: full factory range
# (0 to 1, end stops handled by the hand motor) and faster movement than an arm.
per_joint_margin:
  LHand: 0.0
  RHand: 0.0
per_joint_acceleration:
  HeadYaw: 8.0
  HeadPitch: 8.0
  LHand: 20.0
  RHand: 20.0
check_rate_hz: 100              # the full path is checked at this rate
min_duration_s: 0.3
max_duration_s: 15.0
start_tolerance_rad: 0.05       # tolerated gap between the measured state and the start of a segment
transition_velocity_rad_s: 0.5  # max velocity of the rest <-> start <-> gesture transitions
# Rest may be outside the calibrated movement zone (arms resting on the knees:
# contact). The rest <-> start segments are therefore checked against the factory limits,
# the velocity below and the acceleration, without margin or coupled constraints. Making sure
# the start pose can be reached smoothly from rest is up to whoever calibrates.
# "factory" = the same per-joint limits as the gestures (factory velocities above, and
# their accelerations); these segments are then built at 0.8 x those limits, like the
# start <-> gesture transitions (operator's choice 2026-11-23, contact risk with the
# knees accepted). A number (rad/s, e.g. the former 0.3) applies that velocity to every
# joint, with 0.25 x max_acceleration_rad_s2.
rest_velocity_rad_s: factory

# Linear coupled constraints: sum(coef_i * q_i) <= bound (radians), on top of the
# hulls measured by the calibration. None by default: the five examples shipped here
# (never measured) refused one gesture in ten on their own, including any arm raised high
# (bras_gauche_vers_tete). Format:
#   - name: tete_baissee_tournee
#     description: "Limit head flexion when it is turned a lot."
#     terms: {HeadPitch: 1.0, HeadYaw: 0.25}
#     bound: 0.50
coupled_constraints: []
