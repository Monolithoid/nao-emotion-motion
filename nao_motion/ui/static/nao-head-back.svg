    <circle cx="23" cy="21" r="1.4"/><circle cx="27" cy="21" r="1.4"/><circle cx="37" cy="21" r="1.4"/><circle cx="41" cy="21" r="1.4"/>
    <circle cx="25" cy="26" r="1.4"/><circle cx="29" cy="26" r="1.4"/><circle cx="35" cy="26" r="1.4"/><circle cx="39" cy="26" r="1.4"/>
  </g>
  <!-- arête centrale -->
  <rect x="31" y="8" width="2" height="29" rx="1" fill="#9aa0a8"/>
