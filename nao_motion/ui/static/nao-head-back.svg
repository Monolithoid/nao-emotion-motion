  <rect x="2" y="22" width="12" height="22" rx="6" fill="#4a4f57"/>
  <rect x="50" y="22" width="12" height="22" rx="6" fill="#4a4f57"/>
  <!-- crâne -->
  <path d="M10 30 C10 12 20 4 32 4 C44 4 54 12 54 30 L54 44 C54 54 44 60 32 60 C20 60 10 54 10 44 Z" fill="#f4f5f7" stroke="#2b2f36" stroke-width="3"/>
